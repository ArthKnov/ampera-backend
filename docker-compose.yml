services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ampera
      POSTGRES_PASSWORD: ampera
      POSTGRES_DB: ampera
    ports:
      - "5432:5432"
    volumes:
      - ampera-pg:/var/lib/postgresql/data
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  ampera-pg:
